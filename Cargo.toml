[workspace]
resolver = "2"
members = [
  "apps/lilia-cli",
  "apps/lilia-daemon",
  "crates/lilia-analytics",
  "crates/lilia-core",
  "crates/lilia-embed",
  "crates/lilia-graph",
  "crates/lilia-node-native",
  "crates/lilia-plugin-api",
  "crates/lilia-protocol",
  "crates/lilia-sqlite-native",
  "crates/lilia-storage-sqlite",
  "crates/lilia-wasm",
  "crates/lilia-ffi",
  "plugins/lilia-plugin-json",
  "plugins/lilia-plugin-kv",
  "plugins/lilia-plugin-codec",
  "plugins/lilia-plugin-sql",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/shaynlink/lilia"

[workspace.dependencies]
aes-gcm = "0.10.3"
aes-siv = "0.8.0"
anyhow = "1.0.100"
arrow = { version = "59.3.2", default-features = false }
axum = "0.8.9"
bytes = "1.12.1"
criterion = "0.7.0"
base64 = "0.22.1"
blake3 = "1.5.5"
clap = { version = "4.5.51", features = ["derive"] }
cranelift-codegen = "0.137.2"
cranelift-frontend = "0.137.2"
cranelift-jit = "0.137.2"
cranelift-module = "0.137.2"
cranelift-native = "0.137.2"
crossbeam-queue = "0.3"
datafusion = { version = "55.2.0", default-features = false, features = [
    "datetime_expressions",
    "recursive_protection",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
libloading = "0.9.0"
memmap2 = "0.9.12"
miniz_oxide = "0.8"
napi = { version = "3.4.0", features = ["napi8", "tokio_rt"] }
napi-derive = "3.3.0"
parking_lot = "0.12.5"
parquet = { version = "59.3.2", default-features = false, features = ["arrow", "snap", "flate2-rust_backend", "zstd"] }
pbkdf2 = "0.12.2"
rand = "0.9.2"
rmp-serde = "1.3.0"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "cache", "functions", "session"] }
ruzstd = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
semver = "1.0.28"
sha2 = "0.10.9"
simd-json = "0.14.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zstd = { version = "0.13.3", default-features = false, features = ["zdict_builder"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

