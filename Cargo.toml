[workspace]
resolver = "2"
members = [
  "apps/lilia-cli",
  "apps/lilia-daemon",
  "crates/lilia-analytics",
  "crates/lilia-core",
  "crates/lilia-db",
  "crates/lilia-embed",
  "crates/lilia-engine",
  "crates/lilia-graph",
  "crates/lilia-io",
  "crates/lilia-node-native",
  "crates/lilia-protocol",
  "crates/lilia-wasm",
  "crates/lilia-ffi",
  "crates/lilia-zk",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/shaynlink/lilia"

[workspace.dependencies]
anyhow = "1.0.100"
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-bn254 = { version = "0.6.0", features = ["curve", "r1cs"] }
ark-groth16 = { version = "0.6.0", features = ["r1cs"] }
ark-relations = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-crypto-primitives = { version = "0.6.0", features = ["constraints", "sponge", "crh", "snark"] }
ark-serialize = { version = "0.6.0", features = ["derive"] }
ark-std = "0.6.0"
axum = "0.8.9"
bytes = "1.12.1"
criterion = "0.7.0"
base64 = "0.22.1"
blake3 = "1.5.5"
clap = { version = "4.5.51", features = ["derive"] }
crossbeam-skiplist = "0.1.3"
crc32c = "0.6.9"
datafusion = { version = "55.2.0", default-features = false, features = [
    "datetime_expressions",
    "recursive_protection",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
datafusion-functions-json = "0.55.6"
h3o = { version = "0.11", default-features = false }
hex = "0.4.3"
libc = "0.2.186"
napi = { version = "3.4.0", features = ["napi8", "tokio_rt"] }
napi-derive = "3.3.0"
parking_lot = "0.12.5"
rand = "0.9.2"
rmp-serde = "1.3.0"
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "uuid-1", "bytes-1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
sha2 = "0.10.9"
simd-json = "0.14.3"
thiserror = "2.0.17"
# Each crate names the features it uses: the protocol builds for wasm32, where `net` does not.
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# `psm` 0.1.32 omits watchOS from its Mach-O assembly guard. Keep Apple mobile
# targets buildable until the upstream release containing rust-lang/stacker#152.
[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", rev = "f289c05e5a5f16bc667c48f63a2aa7b4cfb764f5" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# CI check of the Apple slices (tools/mobile/build-apple.sh): proves that every target compiles and
# links, so it skips the optimisation the release profile spends most of its time on.
[profile.apple-check]
inherits = "release"
opt-level = 0
lto = "off"
codegen-units = 256

# The browser module (tools/wasm/build.sh): size before speed, the download being the cost.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every exception to a lint says why (rules of docs/v0.2-storage-paradigm.md §5.2).
allow_attributes_without_reason = "warn"

