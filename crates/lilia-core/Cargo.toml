[package]
name = "lilia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["simd", "cjk"]
simd = ["dep:simd-json"]
cjk = ["dep:jieba-rs"]

[dependencies]
blake3.workspace = true
h3o.workspace = true
hex.workspace = true
jieba-rs = { version = "0.11", optional = true }
rand.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
simd-json = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

# The browser has no OS random source: each getrandom of the tree takes it from JavaScript
# (with the `getrandom_backend` cfg of `.cargo/config.toml`). 0.3 is DataFusion's (rand 0.9),
# 0.4 is rand 0.10's and ahash's.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
uuid = { workspace = true, features = ["js"] }

[lints]
workspace = true
