[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = "0.5.5"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }

[dev-dependencies]
tempfile = "3.27.0"
