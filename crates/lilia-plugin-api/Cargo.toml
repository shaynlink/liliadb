[package]
name = "lilia-plugin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
libloading.workspace = true
lilia-core = { path = "../lilia-core" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "43.0", default-features = false, features = ["cranelift", "std", "wat"] }
wasmtime-wasi = { version = "43.0", default-features = false, features = ["p1"] }

[dev-dependencies]
lilia-storage-sqlite = { path = "../lilia-storage-sqlite" }
