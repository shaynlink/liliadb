[package]
name = "lilia-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
bench-bin = ["dep:clap"]

[[bin]]
name = "lilia_bench"
path = "src/bin/lilia_bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "bench_rusqlite"
path = "src/bin/bench_rusqlite.rs"
required-features = ["bench-bin"]

[dependencies]
lilia-core = { path = "../lilia-core", features = ["sqlite-errors"] }
base64.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lilia-sqlite-native = { path = "../lilia-sqlite-native" }
tempfile = "3.27.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "storage"
harness = false

[lints]
workspace = true
