[package]
name = "lilia-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Vectorized analytics: persistent Arrow columnar segments queried with DataFusion.
# Native targets only; pulls in a multi-threaded runtime and noticeably grows the binary.
analytics = ["dep:lilia-analytics"]
bench-bin = ["dep:clap", "dep:rusqlite"]

[[bin]]
name = "lilia_bench"
path = "src/bin/lilia_bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "bench_rusqlite"
path = "src/bin/bench_rusqlite.rs"
required-features = ["bench-bin"]

[[bin]]
name = "lilia_bench_analytics"
path = "src/bin/lilia_bench_analytics.rs"
required-features = ["bench-bin", "analytics"]

[dependencies]
lilia-core = { path = "../lilia-core" }
lilia-sqlite-native = { path = "../lilia-sqlite-native" }
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
crossbeam-queue = { workspace = true }
hex.workspace = true
rand.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arrow = { workspace = true, features = ["csv"] }
bytes = { workspace = true }
lilia-analytics = { path = "../lilia-analytics", optional = true }
memmap2 = { workspace = true }
parquet = { workspace = true }
tempfile = "3.27.0"
wasmtime = { version = "50.0", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }
zstd.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
criterion.workspace = true
rmp-serde.workspace = true
rusqlite = { workspace = true }
tokio = { version = "1.48.0", default-features = false, features = ["rt-multi-thread"] }

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "query_jit"
harness = false

[lints]
workspace = true
