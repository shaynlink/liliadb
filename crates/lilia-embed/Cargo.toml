[package]
name = "lilia-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Runs inference on the Apple GPU through Metal.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# Uses the Apple Accelerate framework for CPU inference.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# Enables ONNX runtime backend for Android NNAPI, DirectML, and ONNX models.
onnx = ["dep:ort"]

[dependencies]
lilia-core = { path = "../lilia-core" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
serde_json.workspace = true
thiserror.workspace = true
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# ort's defaults, with rustls instead of the platform TLS for downloading ONNX Runtime at build
# time: no OpenSSL to install on Linux.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
  "api-31",
] }

[dev-dependencies]
lilia-db = { path = "../lilia-db" }
tempfile = "3.27.0"

[lints]
workspace = true
