[package]
name = "lilia-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LiliaDB in WebAssembly: the protocol's operations over a database in the browser's origin private file system, or in memory"

[lib]
crate-type = ["cdylib", "rlib"]

# The crate builds for wasm32-unknown-unknown only (see src/lib.rs).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
lilia-core = { path = "../lilia-core" }
lilia-db = { path = "../lilia-db", features = ["sql"] }
lilia-io = { path = "../lilia-io" }
lilia-protocol = { path = "../lilia-protocol" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Random numbers (request ids) from the JavaScript host; see `.cargo/config.toml`.
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
