[package]
name = "project-iot-smart-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-level native Rust Smart Home Edge Gateway & IoT Hub for LiliaDB"

[[bin]]
name = "project-iot-smart-hub"
path = "src/main.rs"

[dependencies]
lilia-core = { path = "../../crates/lilia-core" }
lilia-storage-sqlite = { path = "../../crates/lilia-storage-sqlite" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tempfile = "3.27.0"

[lints]
workspace = true
