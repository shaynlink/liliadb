name: liliadb_flutter
description: Local-first multimodel embedded database (KV, JSON, Graph, FTS5, SQL) for Flutter with transparent AES-256-GCM hardware encryption.
version: 0.1.0-alpha.6
homepage: https://github.com/shaynlink/lilia
repository: https://github.com/shaynlink/lilia/tree/main/packages/flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.liliadb.flutter
        pluginClass: LiliadbFlutterPlugin
      ios:
        pluginClass: LiliadbFlutterPlugin
      macos:
        pluginClass: LiliadbFlutterPlugin
