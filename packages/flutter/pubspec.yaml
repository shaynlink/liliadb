name: liliadb_flutter
description: Local-first multimodel embedded database (key-value, JSON documents, graph, full-text search, read-only SQL) for Flutter, on the LiliaDB engine through dart:ffi.
version: 0.2.0-alpha.1
homepage: https://github.com/shaynlink/lilia
repository: https://github.com/shaynlink/lilia/tree/main/packages/flutter

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Dart calls the engine through dart:ffi: each platform only ships the native library, with
  # no plugin class. Android packs the jniLibs of android/; iOS and macOS share darwin/ (a Swift
  # package and a podspec) around the xcframework.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
