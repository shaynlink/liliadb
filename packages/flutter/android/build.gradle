group 'io.liliadb.flutter'
version '0.2.0-alpha.1'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.2'
    }
}

// The plugin ships the native libraries only: its Dart code calls them through dart:ffi.
apply plugin: 'com.android.library'

android {
    namespace 'io.liliadb.flutter'
    // Flutter's default (flutter.compileSdkVersion): an app compiles against at least the
    // compileSdk of its plugins, and this one has no Kotlin or Java code that needs a newer one.
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../../../release/android/jniLibs']
        }
    }
}

repositories {
    google()
    mavenCentral()
}
