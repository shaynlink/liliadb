buildscript {
    // The app's value of a setting (its root project's `ext`), else this module's default.
    ext.lilia = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.2.1"
    }
}

// Android Gradle Plugin 9 compiles Kotlin itself, as React Native's own modules do.
apply plugin: "com.android.library"
// Generates NativeLiliaReactNativeSpec from src/NativeLiliaReactNative.ts.
apply plugin: "com.facebook.react"

react {
    jsRootDir = file("../src/")
    libraryName = "LiliaReactNativeSpec"
    codegenJavaPackageName = "io.liliadb.reactnative"
}

android {
    namespace "io.liliadb.reactnative"
    compileSdk lilia("compileSdkVersion", 37)

    defaultConfig {
        minSdk lilia("minSdkVersion", 24)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main {
            // The engine's C ABI, packaged with the module that links it.
            jniLibs.srcDirs = ["../../../release/android/jniLibs"]
        }
    }

    packagingOptions {
        // React Native's own libraries come with the app.
        excludes += ["**/libc++_shared.so", "**/libfbjni.so", "**/libjsi.so", "**/libreactnative.so"]
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
}
