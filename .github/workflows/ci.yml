name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    env:
      # candle/gemm emits Armv8.2 half-precision instructions when lilia-embed is built.
      # The hosted ARM64 runner supports them, but Rust's generic target does not enable them.
      RUSTFLAGS: ${{ matrix.runner == 'ubuntu-24.04-arm' && '-C target-feature=+fp16' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy,rustfmt
      - name: Rules of the storage paradigm (§5.2)
        shell: bash
        run: tools/lint.sh
      - run: cargo test --workspace
      - name: Windows cross-account IPC denial
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-windows-accounts.ps1
      - run: cargo build --workspace --release
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Five-surface native conformance
        run: pnpm nx run lilia-conformance:test

  supply-chain:
    name: Rust dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  javascript-style:
    name: JavaScript lint and format (oxlint, oxfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:js
      - run: pnpm format:check

  node:
    strategy:
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx show projects
      - run: pnpm --filter "@liliadb/node..." build
      - run: pnpm --filter "@liliadb/node..." lint
      - run: pnpm --filter @liliadb/client test
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Five-surface Node version conformance
        run: pnpm nx run lilia-conformance:test

  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    env:
      # The zstd that DataFusion links is C: it needs a compiler that targets wasm32.
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Lints of the browser-only code (OPFS, the binding)
        run: cargo clippy -p lilia-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the module
        run: tools/wasm/build.sh
      - run: pnpm --filter "@liliadb/wasm..." build
      - run: pnpm --filter @liliadb/wasm test
