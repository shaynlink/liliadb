name: mobile-targets

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/mobile/**'
      - '.github/workflows/mobile-targets.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/mobile/**'
      - '.github/workflows/mobile-targets.yml'

permissions:
  contents: read

jobs:
  check-apple-targets:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select a full Xcode installation
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Export the selected Xcode developer directory
        run: echo "DEVELOPER_DIR=${MD_APPLE_SDK_ROOT}/Contents/Developer" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-watchos,aarch64-apple-tvos
      - uses: Swatinem/rust-cache@v2
      - name: Verify compilation for Apple targets (iOS, watchOS, tvOS)
        run: |
          cargo check -p lilia-db -p lilia-ffi --target aarch64-apple-ios
          cargo check -p lilia-db -p lilia-ffi --target aarch64-apple-ios-sim
          cargo check -p lilia-db -p lilia-ffi --target aarch64-apple-watchos
          cargo check -p lilia-db -p lilia-ffi --target aarch64-apple-tvos
      - name: Test Apple XCFramework build script
        env:
          LILIA_APPLE_PROFILE: apple-check
        run: ./tools/mobile/build-apple.sh

  check-android-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Verify Kotlin bindings generation
        run: ./tools/mobile/build-android.sh
