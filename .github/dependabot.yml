# Dependency updates, one pull request a week per ecosystem: minor and patch releases are grouped,
# each major release gets its own pull request. Security updates are opened as soon as an
# advisory is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /tools/lilia-bench
    schedule:
      interval: weekly
    groups:
      lilia-bench:
        update-types: [minor, patch]

  # The pnpm workspace: every package of pnpm-workspace.yaml, from the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories: [/packages/android-sdk, /packages/react-native/android, /packages/flutter/android]
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /packages/apple-spm
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /packages/flutter
    schedule:
      interval: weekly
