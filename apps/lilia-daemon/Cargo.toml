[package]
name = "lilia-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
hex.workspace = true
lilia-io = { path = "../../crates/lilia-io", features = ["ipc"] }
lilia-core = { path = "../../crates/lilia-core" }
lilia-db = { path = "../../crates/lilia-db" }
lilia-protocol = { path = "../../crates/lilia-protocol" }
rand.workspace = true
subtle = "2.6.1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
tempfile = "3.27.0"

[dev-dependencies]
http-body-util = "0.1.2"
